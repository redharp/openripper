name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check src tests migrations scripts
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/check_packages.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --check src/openripper/static/app.js
      - run: node --check src/openripper/static/integrations.js
      - run: node tests/test_queue_paths.cjs
      - run: node tests/test_live_feedback.cjs

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actions are pinned to commit hashes
        run: |
          # A tag such as @v4 can be moved to different code after review; a full commit hash cannot.
          unpinned=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE 'uses:[[:space:]]+[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' \
            | grep -vE 'uses:[[:space:]]+(\./|docker://)' || true)
          if [ -n "$unpinned" ]; then
            echo "Pin these actions to a full commit hash, with the version as a comment:"
            echo "$unpinned"
            exit 1
          fi
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.simulate.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.devices.example.yaml config --quiet
      - run: docker build -t openripper:ci .
